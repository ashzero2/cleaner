[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
clrs-core = { path = "crates/core" }
anyhow = "1.0"
crc32fast = "1.4"
dispatch2 = "0.3"
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
indicatif = "0.18"
libc = "0.2"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFDate", "CFString", "CFUUID"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["FSEvents", "libc", "dispatch2"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
trash = "5.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

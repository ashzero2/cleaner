[[rule]]
id = "npm-cache"
name = "npm cache"
category = "package-caches"
safety = "safe"
paths = ["~/.npm"]
command = ["npm", "cache", "clean", "--force"]

[[rule]]
id = "pnpm-store"
name = "pnpm store"
category = "package-caches"
safety = "safe"
paths = ["~/Library/pnpm/store"]

[[rule]]
id = "yarn-cache"
name = "Yarn cache"
category = "package-caches"
safety = "safe"
paths = ["~/Library/Caches/Yarn", "~/.yarn/berry/cache"]

[[rule]]
id = "build-output"
name = "Next.js & Turbo build output"
category = "build-output"
safety = "safe"
paths = ["~/**/.next", "~/**/.turbo"]

[[rule]]
id = "gradle-caches"
name = "Gradle caches"
category = "package-caches"
safety = "safe"
paths = ["~/.gradle/caches"]

[[rule]]
id = "cargo-registry"
name = "Cargo registry downloads"
category = "package-caches"
safety = "safe"
paths = ["~/.cargo/registry/cache", "~/.cargo/registry/src", "~/.cargo/git/checkouts"]

[[rule]]
id = "homebrew-cache"
name = "Homebrew downloads"
category = "package-caches"
safety = "safe"
paths = ["~/Library/Caches/Homebrew"]

[[rule]]
id = "python-caches"
name = "uv & pip caches"
category = "package-caches"
safety = "safe"
paths = ["~/.cache/uv", "~/.cache/pip", "~/Library/Caches/pip"]

[[rule]]
id = "browser-automation"
name = "Puppeteer & Playwright browsers"
category = "package-caches"
safety = "safe"
paths = ["~/.cache/puppeteer", "~/Library/Caches/ms-playwright"]

[[rule]]
id = "cocoapods-cache"
name = "CocoaPods cache"
category = "package-caches"
safety = "safe"
paths = ["~/Library/Caches/CocoaPods"]

[[rule]]
id = "user-logs"
name = "User logs"
category = "logs"
safety = "safe"
paths = ["~/Library/Logs"]

[[rule]]
id = "xcode-derived-data"
name = "Xcode DerivedData"
category = "ios-sdks"
safety = "review"
paths = ["~/Library/Developer/Xcode/DerivedData"]

[[rule]]
id = "xcode-device-support"
name = "Xcode device support"
category = "ios-sdks"
safety = "review"
paths = ["~/Library/Developer/Xcode/iOS DeviceSupport"]

[[rule]]
id = "xcode-archives"
name = "Xcode archives"
category = "ios-sdks"
safety = "review"
paths = ["~/Library/Developer/Xcode/Archives"]

[[rule]]
id = "ios-simulators"
name = "iOS simulators"
category = "ios-sdks"
safety = "review"
paths = ["~/Library/Developer/CoreSimulator/Devices"]
command = ["xcrun", "simctl", "delete", "unavailable"]

[[rule]]
id = "android-sdk"
name = "Android SDK"
category = "android"
safety = "review"
paths = ["~/Library/Android/sdk"]

[[rule]]
id = "android-emulators"
name = "Android emulator images"
category = "android"
safety = "review"
paths = ["~/.android/avd"]

[[rule]]
id = "ollama-models"
name = "Ollama models"
category = "ai-models"
safety = "review"
paths = ["~/.ollama/models"]

[[rule]]
id = "lmstudio-models"
name = "LM Studio models"
category = "ai-models"
safety = "review"
paths = ["~/.lmstudio/models"]

[[rule]]
id = "huggingface-cache"
name = "Hugging Face cache"
category = "ai-models"
safety = "review"
paths = ["~/.cache/huggingface"]

[[rule]]
id = "node-modules"
name = "node_modules"
category = "code-projects"
safety = "review"
paths = ["~/**/node_modules"]
requires_sibling = "package.json"
